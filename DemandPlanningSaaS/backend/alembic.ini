# Alembic configuration for Planora AI.
#
# The database URL is NOT set here on purpose — env.py reads it from
# database.DATABASE_URL so Alembic and the application can never disagree
# about which database they target.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS-native path separators when generating version files.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
