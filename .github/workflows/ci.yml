name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend — tests, migrations, tenant guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DemandPlanningSaaS/backend
    env:
      # Test-only signing key; the app has no insecure default (secrets come from env).
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: DemandPlanningSaaS/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tenant-stamp guard (bulk inserts must set organization_id)
        run: python -m scripts.check_tenant_stamps

      - name: Migrations apply cleanly from scratch
        env:
          DATABASE_URL: sqlite:///./_ci_migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base
          rm -f _ci_migrations.db

      - name: Run tests
        run: pytest
